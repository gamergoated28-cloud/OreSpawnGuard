name: Build OreSpawnGuard

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Download Repository
    uses: actions/checkout@v4

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'

  - name: Extract Source ZIP
    shell: bash
    run: |
      set -e

      mkdir -p extracted

      ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

      if [ -z "$ZIP" ]; then
        echo "ERROR: No ZIP found in repository root!"
        exit 1
      fi

      echo "Found ZIP: $ZIP"
      unzip -o "$ZIP" -d extracted

  - name: Find Maven Project
    shell: bash
    run: |
      set -e

      POM=$(find extracted -type f -name pom.xml | head -n 1)

      if [ -z "$POM" ]; then
        echo "ERROR: pom.xml not found!"
        exit 1
      fi

      echo "PROJECT_DIR=$(dirname "$POM")" >> "$GITHUB_ENV"

  - name: Compile Plugin
    run: |
      mvn -B -f "$PROJECT_DIR/pom.xml" clean package

  - name: Verify JAR
    run: |
      ls -lh "$PROJECT_DIR/target/"*.jar

  - name: Upload Plugin
    uses: actions/upload-artifact@v4
    with:
      name: OreSpawnGuard-JAR
      path: ${{ env.PROJECT_DIR }}/target/*.jar
      if-no-files-found: error
