name: Build OreSpawnGuard JAR

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Install Java 21
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'

  - name: Extract Source ZIP
    shell: bash
    run: |
      set -e
      mkdir extracted

      ZIP="./OreSpawnGuard-source.zip"

      if [ ! -f "$ZIP" ]; then
        echo "ERROR: ZIP file not found!"
        exit 1
      fi

      unzip -q "$ZIP" -d extracted
      echo "ZIP extracted successfully!"

  - name: Find Maven Project
    shell: bash
    run: |
      set -e

      POM=$(find extracted -name pom.xml -print -quit)

      if [ -z "$POM" ]; then
        echo "ERROR: pom.xml missing!"
        exit 1
      fi

      PROJECT_DIR=$(dirname "$POM")
      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      echo "Found project: $PROJECT_DIR"

  - name: Compile Java Plugin
    run: |
      cd "$PROJECT_DIR"
      mvn --batch-mode clean package -DskipTests

  - name: Check Generated JAR
    run: |
      ls -lh "$PROJECT_DIR/target/"
      test -f "$PROJECT_DIR/target/OreSpawnGuard-1.0.0.jar"

  - name: Upload Final JAR
    uses: actions/upload-artifact@v4
    with:
      name: OreSpawnGuard-JAR
      path: extracted/OreSpawnGuard/target/OreSpawnGuard-1.0.0.jar
      if-no-files-found: error
