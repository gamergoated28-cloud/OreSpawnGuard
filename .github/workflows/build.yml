name: Build OreMC Fruits

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout source
    uses: actions/checkout@v4

  - name: Install Java 21
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'
      cache: maven

  - name: Extract plugin source
    run: |
      mkdir -p extracted
      ZIP=$(find . -maxdepth 1 -iname '*.zip' -print -quit)

      if [ -z "$ZIP" ]; then
        echo "Source ZIP not found"
        exit 1
      fi

      unzip -o "$ZIP" -d extracted

  - name: Locate Maven project
    run: |
      POM=$(find extracted -name pom.xml -print -quit)

      if [ -z "$POM" ]; then
        echo "pom.xml not found"
        exit 1
      fi

      echo "POM=$POM" >> "$GITHUB_ENV"
      echo "PROJECT_DIR=$(dirname "$POM")" >> "$GITHUB_ENV"

  - name: Compile OreMC Fruits
    run: mvn -B -f "$POM" clean package

  - name: Upload JAR
    uses: actions/upload-artifact@v4
    with:
      name: OreMCFruits-JAR
      path: ${{ env.PROJECT_DIR }}/target/*.jar
      if-no-files-found: error
