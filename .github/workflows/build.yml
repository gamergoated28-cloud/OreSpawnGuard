name: OreSpawnGuard Build

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'
      cache: maven

  - name: Extract ZIP
    run: |
      mkdir source
      unzip -o OreSpawnGuard-source.zip -d source

  - name: Find pom.xml
    run: |
      find source -name pom.xml

  - name: Build
    run: |
      POM=$(find source -name pom.xml | head -n 1)
      test -n "$POM"
      mvn -B -f "$POM" clean package

  - name: Upload JAR
    uses: actions/upload-artifact@v4
    with:
      name: OreSpawnGuard
      path: source/**/target/*.jar
      if-no-files-found: error
